[Service]
Endpoint=GoogleTranslate
FallbackEndpoint=

[Custom]
Url=http://localhost:{PROXY_PORT}/api/v1/proxy/translate

[CustomHTTP]
Url=http://localhost:{PROXY_PORT}/api/v1/proxy/translate

[General]
Language=vi
FromLanguage={LANG}

[Files]
Directory=Translation\{Lang}\Text
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt
SubstitutionFile=Translation\{Lang}\Text\_Substitutions.txt
PreprocessorsFile=Translation\{Lang}\Text\_Preprocessors.txt
PostprocessorsFile=Translation\{Lang}\Text\_Postprocessors.txt

[TextFrameworks]
EnableIMGUI=False
EnableUGUI=True
EnableNGUI=True
EnableTextMeshPro=True
EnableTextMesh=False
EnableFairyGUI=True

[Behaviour]
MaxCharactersPerTranslation=2000
IgnoreWhitespaceInDialogue=True
MinDialogueChars=20
ForceSplitTextAfterCharacters=0
CopyToClipboard=False
EnableUIResizing=True
EnableBatching=True
UseStaticTranslations=True
OverrideFont=Arial
OverrideFontSize=
OverrideFontTextMeshPro=
FallbackFontTextMeshPro=arialuni_sdf-u55to2017
ResizeUILineSpacingScale=
ForceUIResizing=False
IgnoreTextStartingWith=\u180e;
TextGetterCompatibilityMode=False

[Google]
ServiceUrl=http://localhost:8080

[GoogleV2]
ServiceUrl=
RPCID=MkEWBc
VERSION=boq_translate-webserver_20210323.10_p0
UseSimplest=False

