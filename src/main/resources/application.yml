app:
  module: translate
  gui: true

server:
  port: ${SERVER_PORT:8080}

ai:
  provider: ${AI_PROVIDER:ollama}
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
  gemini:
    apiKey: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  googletranslate:
    apiKey: ${GOOGLE_TRANSLATE_API_KEY:}
  openapi:
    url: ${OPENAPI_URL:https://api.openai.com/v1}
    apiKey: ${OPENAPI_API_KEY:}
    model: ${OPENAPI_MODEL:gpt-4o-mini}

io:
  inputDir: ./data/input
  outputDir: ./data/output
