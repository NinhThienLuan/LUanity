app:
  module: translate
  gui: true

server:
  port: 8080

ai:
  provider: ollama
  ollama:
    url: http://localhost:11434
    model: gemma2:2b
  gemini:
    apiKey: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
  googletranslate:
    apiKey: ${GOOGLE_TRANSLATE_API_KEY:}

io:
  inputDir: ./data/input
  outputDir: ./data/output
